services:
  gitlab:
    image: 'gitlab/gitlab-ce:18.4.1-ce.0'
    container_name: gitlab-local
    restart: always
    hostname: 'localhost'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        # Reduce memory usage for local development
        puma['worker_processes'] = 2
        sidekiq['max_concurrency'] = 10
        prometheus_monitoring['enable'] = false
        # Enable API access
        gitlab_rails['initial_root_password'] = 'O8WSQYPOpl3KObrzn78e'
    ports:
      - '8929:8929'   # GitLab web interface
      - '2224:22'     # GitLab SSH
    volumes:
      - './gitlab/config:/etc/gitlab'
      - './gitlab/logs:/var/log/gitlab'
      - './gitlab/data:/var/opt/gitlab'
    shm_size: '256m'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8929/-/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  default:
    name: review-bot-network